      <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    </button>
  </div>

<main class="wrap" id="view" tabindex="-1" aria-label="主内容区"></main>

<!-- 视效层：极光缓动 + 纸颗粒（纯装饰，aria-hidden） -->
<div class="aurora" aria-hidden="true"><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<!-- 桌宠：固定在视口上自由漂浮，可拖动、有重力、会自己溜达 -->
<div class="pet" id="pet" aria-label="学习助手"></div>

<!-- 左侧信息栏：报告信封 + 本轮进度。窄屏整栏不出现，避免压到正文 -->
<div class="rail" id="rail">
  <div class="mail" id="mail" role="button" tabindex="0" aria-label="查看词汇账户等级报告">
    <div class="mail-env" aria-hidden="true">
      <div class="mail-body"></div>
      <div class="mail-flap"></div>
      <div class="mail-seal locked" id="mailSeal"></div>
    </div>
    <div class="mail-tag" id="mailTag">词汇报告</div>
  </div>

  <!-- 接入自己的 AI：放在左下角这块空白处，点开是完整指南（很多用户其实有厂商账号，只是不知道怎么接） -->
  <button class="rail-card rail-ai" id="railAi" data-act="ai-guide" title="接入你自己的 API Key：不限次数，数据不经过我们">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.4l1.7 4 4 1.7-4 1.7-1.7 4-1.7-4-4-1.7 4-1.7z"/><path d="M18 15.6l.8 1.8 1.8.8-1.8.8-.8 1.8-.8-1.8-1.8-.8 1.8-.8z"/></svg>
    <b>接入你的 AI</b>
    <small>用自己的 Key · 不限次</small>
  </button>
  <button class="rail-card" id="railProg" title="本轮检测进度 · 点开按分组推进">
    <svg class="rail-ring" viewBox="0 0 48 48" aria-hidden="true">
      <circle class="rail-ring-bg" cx="24" cy="24" r="19"></circle>
      <circle class="rail-ring-fg" id="railRing" cx="24" cy="24" r="19"></circle>
    </svg>
    <b id="railPct">0%</b>
    <small id="railCov">已测 0 词</small>
  </button>
</div>

<!-- 右上角等级印章：测完后显示等级字母，未测完显示完成度 -->
<button class="seal" id="seal" title="词汇等级 · 点开看报告">
  <span class="seal-in" id="sealIn">?</span>
  <small id="sealNote">测完出等级</small>
</button>
