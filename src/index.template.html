<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="基于大学英语四、六级大纲词汇表的互动式词汇量自测工具（四级 4540 词 / 六级 5716 词）">
<title>英语四六级词汇量检测 · CET-4 / CET-6 Vocabulary Checker</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<!-- 入场页：每次打开都出现，点「进入」才进主界面。
     ?intro=0 可跳过（自动化测试用）；prefers-reduced-motion 下保留静态面板，仍然要点击进入 -->
<div class="intro" id="intro" role="dialog" aria-modal="true" aria-label="四六级词汇量检测 · 入场">
  <div class="intro-bg" aria-hidden="true"><i></i><i></i></div>
  <div class="intro-frame" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div class="intro-stage">
    <p class="intro-kicker"><span>筑视界 · 码绘交互</span><b>/</b><span>Web 前端开发创意技能大赛</span></p>
    <h1 class="intro-title">
      <span><i style="--i:0">词</i></span><span><i style="--i:1">汇</i></span><span><i style="--i:2">量</i></span><em><span><i style="--i:3">检</i></span></em><em><span><i style="--i:4">测</i></span></em>
    </h1>
    <p class="intro-sub">CET-4 / CET-6 VOCABULARY PROFILER</p>
    <div class="intro-stats">
      <span><b data-intro-num="words">0</b>词库</span>
      <span><b data-intro-num="sent">0</b>例句</span>
      <span><b>±250</b>词区间</span>
      <span>纯前端 · 断网可用</span>
    </div>
    <button class="intro-enter" id="introEnter" type="button">
      进入
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
    </button>
    <p class="intro-hint">点击任意处或按 <kbd>Enter</kbd> 进入</p>
  </div>
  <div class="intro-whale" id="introWhaleBox" aria-hidden="true"><img id="introWhale" alt=""></div>
  <div class="intro-seal" aria-hidden="true">V / CET · VOCAB</div>
</div>

<header class="topbar">
  <div class="topbar-in">
    <div class="logo"><span class="dot">V</span><span>四六级词汇量检测</span></div>
    <div class="spacer"></div>
    <div class="tb-stat" id="tbStat"></div>
    <button class="who-btn" id="aiBtn" data-act="ai-open" title="AI 诊断（大模型需要作者提供的密码）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l1.9 4.4 4.4 1.9-4.4 1.9L12 15.8l-1.9-4.4L5.7 9.5l4.4-1.9z"/><path d="M18.5 15.5l.9 2 2 .9-2 .9-.9 2-.9-2-2-.9 2-.9z"/></svg>
      <span>AI 诊断</span>
    </button>
    <button class="who-btn" id="whoBtn" data-act="profiles" title="切换使用者 / 新建使用者">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.4" r="3.5"/><path d="M4.9 20c.6-3.5 3.5-5.5 7.1-5.5s6.5 2 7.1 5.5"/></svg>
      <span id="whoName">本机用户</span>
    </button>
    <button class="icon-btn" id="themeBtn" title="切换深色/浅色" aria-label="切换深色或浅色主题">
      <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="view" tabindex="-1" aria-label="主内容区"></main>

<!-- 视效层：极光缓动 + 纸颗粒（纯装饰，aria-hidden） -->
<div class="aurora" aria-hidden="true"><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<!-- 桌宠：固定在视口上自由漂浮，可拖动、有重力、会自己溜达 -->
<div class="pet" id="pet" aria-label="学习助手"></div>

<!-- 左侧信息栏：报告信封 + 本轮进度。窄屏整栏不出现，避免压到正文 -->
<div class="rail" id="rail">
  <div class="mail" id="mail" role="button" tabindex="0" aria-label="查看词汇等级报告">
    <div class="mail-env" aria-hidden="true">
      <div class="mail-body"></div>
      <div class="mail-flap"></div>
      <div class="mail-seal locked" id="mailSeal"></div>
    </div>
    <div class="mail-tag" id="mailTag">词汇报告</div>
  </div>

  <button class="rail-card" id="railProg" title="本轮检测进度 · 点开按分组推进">
    <svg class="rail-ring" viewBox="0 0 48 48" aria-hidden="true">
      <circle class="rail-ring-bg" cx="24" cy="24" r="19"></circle>
      <circle class="rail-ring-fg" id="railRing" cx="24" cy="24" r="19"></circle>
    </svg>
    <b id="railPct">0%</b>
    <small id="railCov">已测 0 词</small>
  </button>
</div>

<!-- 右上角等级印章：测完后显示等级字母，未测完显示完成度 -->
<button class="seal" id="seal" title="词汇等级 · 点开看报告">
  <span class="seal-in" id="sealIn">?</span>
  <small id="sealNote">测完出等级</small>
</button>

<nav class="nav">
  <div class="nav-in">
    <span class="nav-pill" id="navPill" aria-hidden="true"></span>
    <button data-nav="home" class="on">首页</button>
    <button data-nav="test">检测</button>
    <button data-nav="groups">分组</button>
    <button data-nav="stats">总览</button>
    <button data-nav="report">报告</button>
    <button data-nav="settings">设置</button>
  </div>
</nav>

<div class="toast" id="toast"></div>
<div class="sr-only" id="live" role="status" aria-live="polite"></div>
<div id="modal"></div>

<script>window.PET_ART = /*__PETART__*/;</script>
<!-- AI 授权：有密码锁时这里是密文（没有明文 Key）；没有锁时是 null -->
<script>window.AI_LOCK = /*__AILOCK__*/;</script>
<script>window.WORDS = /*__WORDS__*/;</script>
<script>window.SENTENCES = /*__SENTENCES__*/;</script>
<script>
/*__JS__*/
</script>
</body>
</html>
