<!--
  词汇账户余额查询 · 标识「30」——纯矢量（网页形式，清晰度与网页文字一致）

  造型来源：作者提供的 AI 原图。逐行量过之后看清了它的构造：
    · 三段**药丸形**横条（左端是半圆，rx = 高度的一半）
    · 中段比上下两段短，左端起点右移
    · **右侧不是一根直竖脊，而是两处斜接**（上段右端斜向内收到中段、中段再斜向外到下段）
    · 仪表盘：外径 64 / 环厚 10.6 / 内孔约 34% / 橙扇区右上约 85°（按原图实测）

  为什么这么画（都是踩过的坑）：
    · 三段等长 + 直竖脊 → 读成「Ξ / ヨ」
    · 左端三角斜切       → 读成箭头状的「Ǝ」
    · 圆弧碗口           → 读成「Ǝ」
    · 字体字形（Arial Black）→ 能读成 3，但方切角，风格和原图不符
    · 只有「药丸三段 + 斜接」这一种同时满足：读成 3、且风格接近原图
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 64" width="132" height="64" role="img" aria-label="30 · 词汇账户余额查询">
  <title>词汇账户余额查询</title>

  <!-- ================= 3 ================= -->
  <g fill="#1A5FD0">
    <!-- 上、下两段通长；中段偏短 -->
    <rect x="1"  y="0.5"  width="57" height="15" rx="7.5"/>
    <rect x="21" y="24.5" width="37" height="15" rx="7.5"/>
    <rect x="1"  y="48.5" width="57" height="15" rx="7.5"/>
    <!-- 两处斜接：让右侧呈现锯齿而非直脊 -->
    <path d="M44 15.5 H58 L44 24.5 Z"/>
    <path d="M44 39.5 H58 V48.5 Z"/>
  </g>

  <!-- ================= 0：仪表盘 ================= -->
  <circle cx="100" cy="32" r="26.7" fill="none" stroke="#1A5FD0" stroke-width="10.6"/>
  <path d="M97.2 0.12 A32 32 0 0 1 131.5 26.4 L121.1 28.3 A21.4 21.4 0 0 0 98.1 10.65 Z" fill="#FF6B4A"/>
  <line x1="100" y1="32" x2="111.6" y2="17.2" stroke="#FF6B4A" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="100" cy="32" r="4.6" fill="#FF6B4A"/>
</svg>
