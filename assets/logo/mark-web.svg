<?xml version="1.0" encoding="UTF-8"?>
<!--
  词汇账户余额查询 · 标识「30」——纯矢量（网页形式，清晰度与文字一致）

  造型说明（这张图的字形本质是 Ǝ + 段间斜切）：
    · 三段横板连在同一根右侧脊柱上，**每段左端做斜切**
    · 中段明显内缩（左端起点靠右），上段次之，下段向外
    · 正因为左端斜切 + 中段内缩，整体才读成「3」；
      三段等长、左端平齐就会读成「Ξ / ヨ」（前几版就是这个毛病，已实测对比）
    · 仪表盘按原图实测比例：外径 64 / 环厚 10.6 / 内孔约占直径 34% / 橙扇区右上约 85°
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 64" width="132" height="64" role="img" aria-label="30 · 词汇账户余额查询">
  <title>词汇账户余额查询</title>

  <!-- ================= 3 ================= -->
  <g fill="#1A5FD0">
    <!-- 上段：左端自 (36,1) 斜切到 (9,16.5) -->
    <path d="M36 1 H60 V16.5 H9 Z"/>
    <!-- 中段：内缩更多，左端自 (54,23.8) 斜切到 (27,39.2) -->
    <path d="M54 23.8 H60 V39.2 H27 Z"/>
    <!-- 下段：左端自 (9,47.5) 斜切到 (36,63) -->
    <path d="M9 47.5 H60 V63 H36 Z"/>
  </g>

  <!-- ================= 0：仪表盘 ================= -->
  <circle cx="100" cy="32" r="26.7" fill="none" stroke="#1A5FD0" stroke-width="10.6"/>

  <!-- 橙色环带扇区：-95° → -10° -->
  <path d="M97.2 0.12 A32 32 0 0 1 131.5 26.4 L121.1 28.3 A21.4 21.4 0 0 0 98.1 10.65 Z" fill="#FF6B4A"/>

  <!-- 指针 + 轴心 -->
  <line x1="100" y1="32" x2="111.6" y2="17.2" stroke="#FF6B4A" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="100" cy="32" r="4.6" fill="#FF6B4A"/>
</svg>
