<?xml version="1.0" encoding="UTF-8"?>
<!--
  词汇账户余额查询 · 标识「30」
  造型：分段式 3（三道横板 + 右侧脊柱 + 两个**左向圆弧碗口**）+ 仪表盘 0。
  来源：作者选定的 AI 概念图，重绘为矢量以支持 16px favicon / 深色反白 / PPT 1024。

  这一版改了什么：把两个楔形（三角）凹口换成圆弧碗口。
  三角凹口在 216px 下会读成"Ξ"（三条等长横杠），因为真 3 的开口是圆的；
  圆弧碗口让"腰部"呈现向内凹的曲线，视觉上才成立为 3。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 64" width="132" height="64" role="img" aria-label="30 · 词汇账户余额查询">
  <title>词汇账户余额查询</title>
  <defs>
    <mask id="bowl">
      <rect x="0" y="0" width="132" height="64" fill="#fff"/>
      <!-- 上碗口：从脊柱左缘向左鼓出，形成 3 的上半个开口 -->
      <path d="M47 15.2 C 30 15.8 25.2 20 25.2 20 C 25.2 20 30 24.2 47 24.8 Z" fill="#000"/>
      <!-- 下碗口 -->
      <path d="M47 39.2 C 30 39.8 25.2 44 25.2 44 C 25.2 44 30 48.2 47 48.8 Z" fill="#000"/>
    </mask>
  </defs>

  <g fill="#2A5BE0" mask="url(#bowl)">
    <rect x="1"  y="0.5"  width="57" height="16" rx="8"/>
    <rect x="22" y="24"   width="36" height="16" rx="8"/>
    <rect x="1"  y="47.5" width="57" height="16" rx="8"/>
    <rect x="42" y="0.5"  width="16" height="63" rx="8"/>
  </g>

  <circle cx="100" cy="32" r="27.4" fill="none" stroke="#2A5BE0" stroke-width="8.6"/>
  <path d="M100 0.5 A31.5 31.5 0 0 1 130.8 25.45 L123.1 27.6 A23.2 23.2 0 0 0 100 9.2 Z" fill="#FF4D2E"/>
  <line x1="100" y1="32" x2="113.4" y2="14.6" stroke="#FF4D2E" stroke-width="3.1" stroke-linecap="round"/>
  <circle cx="100" cy="32" r="4.4" fill="#FF4D2E"/>
</svg>