<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>3 的三种画法对照</title>
<style>
 body{background:#FAF8F4;font:13px/1.5 -apple-system,"Segoe UI","PingFang SC";margin:0;padding:22px;color:#12130F}
 .grid{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-end}
 .col{text-align:center}
 .col h4{font-size:11px;color:#6B7280;margin:0 0 8px;font-weight:600;letter-spacing:.05em}
 .sizes{display:flex;align-items:flex-end;gap:14px;justify-content:center}
 .sizes div{text-align:center}
 .sizes span{display:block;font:9.5px/1 Consolas,monospace;color:#8A8378;margin-top:4px}
 .bar{display:flex;align-items:center;gap:8px;font-weight:660;font-size:15px;
      background:#fff;border:1px solid rgba(16,19,25,.08);border-radius:11px;padding:7px 12px;margin-bottom:12px}
</style></head>
<body>

<!-- ============ A：加深缺口 + 中横缩短（矩形拼） ============ -->
<template id="tplA">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g fill="#2A5BE0">
    <rect x="5.5"  y="9.5"  width="28.5" height="9" rx="4.5"/>
    <rect x="12.5" y="27.5" width="21.5" height="9" rx="4.5"/>
    <rect x="5.5"  y="45.5" width="28.5" height="9" rx="4.5"/>
    <rect x="25"   y="9.5"  width="9" height="45" rx="4.5"/>
  </g>
  <circle cx="47.5" cy="32" r="18.25" fill="none" stroke="#2A5BE0" stroke-width="8.5"/>
  <path d="M47.5 13.75 A8.25 8.25 0 0 1 54.62 22.19 L47.5 32 Z" fill="#FF4D2E"/>
  <line x1="47.5" y1="32" x2="55.6" y2="21.4" stroke="#FF4D2E" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="47.5" cy="32" r="4.3" fill="#FF4D2E"/>
</svg>
</template>

<!-- ============ B：楔形台阶（左端斜切） ============ -->
<template id="tplB">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g fill="#2A5BE0">
    <!-- 上段：左端斜切 -->
    <path d="M9.5 9.5 H29 a4.5 4.5 0 0 1 4.5 4.5 v0 a4.5 4.5 0 0 1-4.5 4.5 H16.5 L9.5 14.2 Z"/>
    <!-- 右脊柱，中段收窄形成两个凹口 -->
    <path d="M25 9.5 h4 a4.5 4.5 0 0 1 4.5 4.5 v36 a4.5 4.5 0 0 1-4.5 4.5 h-4 Z"/>
    <!-- 中段：更短，左端斜切 -->
    <path d="M17.5 27.5 H29 v9 H22 L17.5 32.2 Z"/>
    <!-- 下段：左端斜切 -->
    <path d="M9.5 45.5 H29 a4.5 4.5 0 0 1 0 9 H14.5 L9.5 50.2 Z"/>
  </g>
  <circle cx="47.5" cy="32" r="18.25" fill="none" stroke="#2A5BE0" stroke-width="8.5"/>
  <path d="M47.5 13.75 A8.25 8.25 0 0 1 54.62 22.19 L47.5 32 Z" fill="#FF4D2E"/>
  <line x1="47.5" y1="32" x2="55.6" y2="21.4" stroke="#FF4D2E" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="47.5" cy="32" r="4.3" fill="#FF4D2E"/>
</svg>
</template>

<!-- ============ C：3 用字体重排（最保险） ============ -->
<template id="tplC">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <text x="20.5" y="53.5" text-anchor="middle" font-family="Arial Black, Arial, 'Segoe UI', sans-serif"
        font-size="56" font-weight="900" fill="#2A5BE0" letter-spacing="-2">3</text>
  <circle cx="47.5" cy="32" r="18.25" fill="none" stroke="#2A5BE0" stroke-width="8.5"/>
  <path d="M47.5 13.75 A8.25 8.25 0 0 1 54.62 22.19 L47.5 32 Z" fill="#FF4D2E"/>
  <line x1="47.5" y1="32" x2="55.6" y2="21.4" stroke="#FF4D2E" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="47.5" cy="32" r="4.3" fill="#FF4D2E"/>
</svg>
</template>

<div class="grid" id="grid"></div>

<script>
const cols = [['A 矩形+深缺口','tplA'], ['B 楔形台阶','tplB'], ['C 字体重排','tplC']];
const grid = document.getElementById('grid');
for (const [name, tplId] of cols) {
  const svg = document.getElementById(tplId).innerHTML.trim();
  const col = document.createElement('div');
  col.className = 'col';
  col.innerHTML = '<h4>' + name + '</h4>' +
    '<div class="bar" style="justify-content:center">' +
      '<span style="width:26px;height:26px;display:block">' + svg.replace('<svg ', '<svg width="26" height="26" ') + '</span>' +
      '<span>词汇账户</span></div>' +
    '<div class="sizes">' +
      [16, 24, 32, 64, 128].map(s => '<div><i style="display:block;width:' + s + 'px;height:' + s + 'px">' +
        svg.replace('<svg ', '<svg width="' + s + '" height="' + s + '" ') + '</i><span>' + s + '</span></div>').join('') +
    '</div>';
  grid.appendChild(col);
}
</script>
</body></html>
