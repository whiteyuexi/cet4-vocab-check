<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>城池风格对照</title>
<style>
  body{margin:0;background:#6f8a54;font:14px -apple-system,"Segoe UI",sans-serif;color:#22301c}
  .wrap{display:flex;gap:0;align-items:flex-start}
  .cell{width:340px;height:300px;position:relative;overflow:hidden}
  .cell canvas{display:block}
  .tag{position:absolute;left:10px;top:10px;background:rgba(18,20,24,.86);color:#f6f3ea;
    padding:6px 10px;border-radius:6px;font-size:12px;line-height:1.5}
  .tag b{font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="cell"><canvas id="a" width="340" height="300"></canvas><div class="tag"><b>A 现状</b><br>白盒 + 平顶 + 四角块</div></div>
  <div class="cell"><canvas id="b" width="340" height="300"></canvas><div class="tag"><b>B 细节版</b><br>垛口 / 城门 / 双层屋檐 / 窗 / 投影 / 树</div></div>
  <div class="cell"><canvas id="c" width="340" height="300"></canvas><div class="tag"><b>C 图标版</b><br>扁平城堡 + 旗帜（像参考图 3）</div></div>
</div>
<script>
function bg(g, W, H) {
  var lg = g.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, '#8aa85f'); lg.addColorStop(1, '#5f7d45');
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  var s = 99;
  function rnd() { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }
  for (var i = 0; i < 120; i++) {
    var x = rnd() * W, y = rnd() * H, r = 6 + rnd() * 26;
    var rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, rnd() < 0.5 ? '#9dbb72' : '#6b8a4c');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalAlpha = 0.07; g.fillStyle = rg;
    g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  }
  g.globalAlpha = 1;
}
function isoBox(g, x, y, hw, hd, h, top, left, right) {
  g.beginPath(); g.moveTo(x, y - hd); g.lineTo(x + hw, y); g.lineTo(x, y + hd); g.lineTo(x - hw, y); g.closePath();
  g.fillStyle = top; g.fill();
  g.beginPath(); g.moveTo(x - hw, y); g.lineTo(x, y + hd); g.lineTo(x, y + hd + h); g.lineTo(x - hw, y + h); g.closePath();
  g.fillStyle = left; g.fill();
  g.beginPath(); g.moveTo(x + hw, y); g.lineTo(x, y + hd); g.lineTo(x, y + hd + h); g.lineTo(x + hw, y + h); g.closePath();
  g.fillStyle = right; g.fill();
}
function pyramid(g, x, yTop, hw, hd, h, lit, dark) {
  // 四个坡面：左上/右上亮暗不同
  g.fillStyle = lit;
  g.beginPath(); g.moveTo(x, yTop - h); g.lineTo(x + hw, yTop); g.lineTo(x, yTop + hd); g.closePath(); g.fill();
  g.fillStyle = dark;
  g.beginPath(); g.moveTo(x, yTop - h); g.lineTo(x - hw, yTop); g.lineTo(x, yTop + hd); g.closePath(); g.fill();
}

/* ---------- A：现状 ---------- */
(function () {
  var cv = document.getElementById('a'), g = cv.getContext('2d');
  bg(g, 340, 300);
  var x = 170, y = 170, r = 62;
  g.fillStyle = 'rgba(0,0,0,.22)';
  g.beginPath(); g.ellipse(x, y + 18, r * 1.05, r * 0.36, 0, 0, 6.2832); g.fill();
  isoBox(g, x, y, r, r * 0.5, 5, '#f4efe2', '#ddd6c4', '#a8a08c');
  var w = r * 0.72;
  [[-w, 0], [w, 0], [0, -r * 0.36], [0, r * 0.36]].forEach(function (o) {
    isoBox(g, x + o[0], y + o[1] + 5, r * 0.16, r * 0.08, 9, '#f4efe2', '#ddd6c4', '#a8a08c');
  });
  isoBox(g, x, y + 5, r * 0.34, r * 0.17, 40, '#f4efe2', '#ddd6c4', '#a8a08c');
  g.fillStyle = '#b04a3a';
  g.beginPath();
  g.moveTo(x, y + 5 - 40 - r * 0.16 - r * 0.26);
  g.lineTo(x + r * 0.38, y + 5 - 40 - r * 0.16);
  g.lineTo(x, y + 5 - 40 - r * 0.16 + r * 0.17);
  g.lineTo(x - r * 0.38, y + 5 - 40 - r * 0.16);
  g.closePath(); g.fill();
})();

/* ---------- B：细节版 ---------- */
(function () {
  var cv = document.getElementById('b'), g = cv.getContext('2d');
  bg(g, 340, 300);
  var x = 170, y = 176, r = 66;
  var STONE_T = '#efe7d2', STONE_L = '#cfc4a8', STONE_R = '#a99d80', STONE_D = '#8a7f64';
  var ROOF_L = '#c25a44', ROOF_D = '#8d3a2b';

  // 投影（光从左上来，影子往右下）
  g.fillStyle = 'rgba(0,0,0,.20)';
  g.beginPath(); g.ellipse(x + 8, y + 20, r * 1.02, r * 0.34, 0, 0, 6.2832); g.fill();

  // 土台
  isoBox(g, x, y, r, r * 0.5, 7, '#cbbf9e', '#b3a684', '#8f8468');

  // 城墙：外圈 + 内院
  var hw = r * 0.86, hd = r * 0.43, wallH = 16;
  // 外墙两个可见面
  g.fillStyle = STONE_L;
  g.beginPath(); g.moveTo(x - hw, y + 3); g.lineTo(x, y + hd + 3); g.lineTo(x, y + hd + 3 + wallH); g.lineTo(x - hw, y + 3 + wallH); g.closePath(); g.fill();
  g.fillStyle = STONE_R;
  g.beginPath(); g.moveTo(x + hw, y + 3); g.lineTo(x, y + hd + 3); g.lineTo(x, y + hd + 3 + wallH); g.lineTo(x + hw, y + 3 + wallH); g.closePath(); g.fill();
  // 墙顶
  g.fillStyle = STONE_T;
  g.beginPath();
  g.moveTo(x, y + 3 - hd); g.lineTo(x + hw, y + 3); g.lineTo(x, y + 3 + hd); g.lineTo(x - hw, y + 3); g.closePath(); g.fill();
  // 内院（挖空）
  g.fillStyle = '#b9ad8e';
  g.beginPath();
  g.moveTo(x, y + 3 - hd * 0.62); g.lineTo(x + hw * 0.62, y + 3); g.lineTo(x, y + 3 + hd * 0.62); g.lineTo(x - hw * 0.62, y + 3); g.closePath(); g.fill();

  // 垛口：沿两条可见的墙顶边各排一排
  g.fillStyle = STONE_T;
  for (var i = 0; i <= 9; i++) {
    var t = i / 9;
    g.fillRect(x - hw + hw * t - 3, y + 3 - hd + hd * t - 6, 6, 7);
    g.fillRect(x + hw * t - 3 + 0, y + 3 + hd - hd * t - 6, 6, 7);
  }

  // 城门（正面墙上）
  g.fillStyle = '#5b4a34';
  g.beginPath();
  g.moveTo(x - 7, y + hd + 3 + wallH);
  g.lineTo(x - 7, y + hd + 3 + wallH - 11);
  g.quadraticCurveTo(x, y + hd + 3 + wallH - 19, x + 7, y + hd + 3 + wallH - 11);
  g.lineTo(x + 7, y + hd + 3 + wallH);
  g.closePath(); g.fill();

  // 主殿（两层）
  var kx = x, ky = y + 2, kh = 34;
  isoBox(g, kx, ky, r * 0.30, r * 0.15, kh, STONE_T, STONE_L, STONE_R);
  // 窗
  g.fillStyle = 'rgba(60,48,32,.55)';
  g.fillRect(kx - r * 0.16, ky + kh * 0.45, 5, 8);
  g.fillRect(kx + r * 0.05, ky + kh * 0.45, 5, 8);
  // 二层
  isoBox(g, kx, ky - kh + 2, r * 0.20, r * 0.10, 16, STONE_T, STONE_L, STONE_R);
  // 屋檐 + 屋顶
  var ry = ky - kh - 16 + 2;
  g.fillStyle = ROOF_D;
  g.beginPath();
  g.moveTo(kx - r * 0.40, ry); g.lineTo(kx, ry + r * 0.20); g.lineTo(kx + r * 0.40, ry);
  g.lineTo(kx + r * 0.34, ry - 3); g.lineTo(kx, ry + r * 0.16); g.lineTo(kx - r * 0.34, ry - 3);
  g.closePath(); g.fill();
  pyramid(g, kx, ry - 4, r * 0.26, r * 0.13, 20, ROOF_L, ROOF_D);

  // 角楼两座
  [[-hw * 0.9, -hd * 0.10], [hw * 0.9, -hd * 0.10]].forEach(function (o, idx) {
    var tx = x + o[0], ty = y + 4 + o[1], th = 26;
    isoBox(g, tx, ty, r * 0.15, r * 0.075, th, STONE_T, STONE_L, STONE_R);
    pyramid(g, tx, ty - th, r * 0.19, r * 0.10, 14, ROOF_L, ROOF_D);
  });

  // 旗
  var topY = ry - 24;
  g.strokeStyle = 'rgba(40,30,20,.7)'; g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(kx, ry - 24); g.lineTo(kx, topY - 16); g.stroke();
  g.fillStyle = '#2f7d5a';
  g.beginPath(); g.moveTo(kx, topY - 16); g.lineTo(kx + 15, topY - 11); g.lineTo(kx, topY - 6); g.closePath(); g.fill();

  // 树
  [[-r * 1.05, r * 0.18], [r * 1.02, r * 0.22], [-r * 0.72, r * 0.42]].forEach(function (o) {
    var tx = x + o[0], ty = y + o[1] + 8;
    g.fillStyle = 'rgba(0,0,0,.16)';
    g.beginPath(); g.ellipse(tx + 2, ty + 4, 9, 3.5, 0, 0, 6.2832); g.fill();
    g.fillStyle = '#3f6b3a';
    g.beginPath(); g.arc(tx, ty - 4, 8, 0, 6.2832); g.fill();
    g.fillStyle = '#4f8046';
    g.beginPath(); g.arc(tx - 2, ty - 7, 6, 0, 6.2832); g.fill();
  });
})();

/* ---------- C：图标版 ---------- */
(function () {
  var cv = document.getElementById('c'), g = cv.getContext('2d');
  bg(g, 340, 300);
  var x = 170, y = 168, s = 1;
  // 地面光圈
  g.fillStyle = 'rgba(0,0,0,.18)';
  g.beginPath(); g.ellipse(x, y + 34, 46, 15, 0, 0, 6.2832); g.fill();
  g.fillStyle = 'rgba(255,255,255,.14)';
  g.beginPath(); g.ellipse(x, y + 34, 42, 13, 0, 0, 6.2832); g.fill();
  // 城堡剪影（扁平）
  var body = '#f2ecdc', shade = '#c9bfa6', dark = '#8f856c';
  g.fillStyle = body;
  g.fillRect(x - 34, y - 10, 68, 44);
  // 城垛
  for (var i = 0; i < 5; i++) g.fillRect(x - 34 + i * 15, y - 18, 9, 9);
  // 侧塔
  [-1, 1].forEach(function (d) {
    g.fillStyle = body;
    g.fillRect(x + d * 40 - 10, y - 34, 20, 68);
    for (var k = 0; k < 2; k++) g.fillRect(x + d * 40 - 10 + k * 12, y - 42, 8, 9);
    g.fillStyle = '#b04a3a';
    g.beginPath(); g.moveTo(x + d * 40 - 14, y - 42); g.lineTo(x + d * 40, y - 62); g.lineTo(x + d * 40 + 14, y - 42); g.closePath(); g.fill();
  });
  // 中央塔
  g.fillStyle = body;
  g.fillRect(x - 14, y - 40, 28, 74);
  for (var j = 0; j < 2; j++) g.fillRect(x - 14 + j * 16, y - 48, 10, 9);
  g.fillStyle = '#b04a3a';
  g.beginPath(); g.moveTo(x - 18, y - 48); g.lineTo(x, y - 74); g.lineTo(x + 18, y - 48); g.closePath(); g.fill();
  // 门
  g.fillStyle = dark;
  g.beginPath();
  g.moveTo(x - 9, y + 34); g.lineTo(x - 9, y + 20);
  g.quadraticCurveTo(x, y + 10, x + 9, y + 20); g.lineTo(x + 9, y + 34);
  g.closePath(); g.fill();
  // 窗
  g.fillStyle = shade;
  g.fillRect(x - 5, y - 28, 4, 7); g.fillRect(x + 2, y - 28, 4, 7);

  // 旗
  g.strokeStyle = '#5c5346'; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(x, y - 74); g.lineTo(x, y - 92); g.stroke();
  g.fillStyle = '#2f7d5a';
  g.beginPath(); g.moveTo(x, y - 92); g.lineTo(x + 17, y - 86); g.lineTo(x, y - 80); g.closePath(); g.fill();
})();
</script>
</body>
</html>
